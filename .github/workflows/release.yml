name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Build skill zip
        run: |
          mkdir transcription-reader
          cp SKILL.md transcription-reader/
          cp -r scripts transcription-reader/
          cp -r references transcription-reader/
          cp LICENSE transcription-reader/
          zip -r "transcription-reader-v${{ steps.version.outputs.version }}.zip" transcription-reader/
          rm -rf transcription-reader

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            transcription-reader-v${{ steps.version.outputs.version }}.zip
