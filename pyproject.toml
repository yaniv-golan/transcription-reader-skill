[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "transcription-reader-skill"
version = "0.2.0"
requires-python = ">=3.9"

[project.optional-dependencies]
test = ["pytest", "stjlib", "webvtt-py", "pysubs2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
